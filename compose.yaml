services:
  lab:
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile
    command: sleep infinity
    environment:
      DATABASE_URL: postgresql://forest_user:forest_password@postgres:5432/forest_db
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: forest_db
      PGUSER: forest_user
      PGPASSWORD: forest_password
    volumes:
      - .:/workspace:cached
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: forest_db
      POSTGRES_USER: forest_user
      POSTGRES_PASSWORD: forest_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forest_user -d forest_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./sql/init:/docker-entrypoint-initdb.d:ro

volumes:
  postgres-data:
