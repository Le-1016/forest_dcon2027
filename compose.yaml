services:
  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "8081:80"
    volumes:
      - ./forest:/usr/share/nginx/html:ro

  api:
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile
    restart: unless-stopped
    command: /usr/local/go/bin/go run ./go/cmd/api
    working_dir: /workspace
    environment:
      DATABASE_URL: postgresql://forest_user:forest_password@postgres:5432/forest_db
    ports:
      - "8080:8080"
    volumes:
      - .:/workspace:cached
    depends_on:
      postgres:
        condition: service_healthy

  lab:
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile
    command: sleep infinity
    environment:
      DATABASE_URL: postgresql://forest_user:forest_password@postgres:5432/forest_db
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: forest_db
      PGUSER: forest_user
      PGPASSWORD: forest_password
    volumes:
      - .:/workspace:cached
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: forest_db
      POSTGRES_USER: forest_user
      POSTGRES_PASSWORD: forest_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forest_user -d forest_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./sql/init:/docker-entrypoint-initdb.d:ro

volumes:
  postgres-data:
